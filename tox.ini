[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
DJANGO =
    4.2: dj42
    5.1: dj51
    5.2: dj52

WAGTAIL =
    6.3: wt63
    7.0: wt70
    7.2: wt72

[tox]
skipsdist = True
usedevelop = True

envlist =
    py{310,311,312}-dj42-wt{63,70,72}
    py{310,311,312,313}-dj{51,52}-wt{63,70,72}
    py314-dj52-wt72

[testenv]
description = Unit tests
install_command = pip install -e ".[testing]" -U {opts} {packages}
commands = coverage run --source=wagtailmakeup runtests.py

basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14

deps =
    dj42: Django>=4.2,<4.3
    dj51: Django>=5.1,<5.2
    dj52: Django>=5.2,<5.3
    wt63: wagtail>=6.3,<6.4
    wt70: wagtail>=7.0,<7.1
    wt72: wagtail>=7.2,<7.3