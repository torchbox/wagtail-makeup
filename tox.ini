[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
DJANGO =
    5.2: dj52
    6.0: dj60

WAGTAIL =
    7.0: wt70
    7.3: wt73
    7.4: wt74

[tox]
skipsdist = True
usedevelop = True

envlist =
    py{310,311,312,313,314}-dj52-wt{70,73,74}
    py{313,314}-dj60-wt{73,74}

[testenv]
description = Unit tests
install_command = pip install -e ".[testing]" -U {opts} {packages}
commands = coverage run --source=wagtailmakeup runtests.py

basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14

deps =
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1
    wt70: wagtail>=7.0,<7.1
    wt73: wagtail>=7.3,<7.4
    wt74: wagtail>=7.4,<7.5
